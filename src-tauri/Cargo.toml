[package]
name = "langlang"
version = "0.1.2"
description = "Popup Korean <-> English translator"
authors = ["Youngjoon Lee"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.cargo-machete]
ignored = ["serde_json"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "langlang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "macos-private-api",
  "image-png",
] }
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-process = "2.4.0"
# Used by `tauri::generate_context!` for the plugin config in tauri.conf.json.
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.0"
